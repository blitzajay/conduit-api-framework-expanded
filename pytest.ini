[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -ra --strict-markers
markers =
    smoke: critical API and UI smoke coverage
    regression: broader regression coverage
    negative: invalid-input and authorization scenarios
    integration: multi-endpoint business workflows
    ui: Playwright browser tests
    unit: isolated framework tests with no network dependency
log_cli = true
log_cli_level = INFO
